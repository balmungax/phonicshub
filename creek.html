<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Creek Explorers | Picture Book</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;0,600;1,400&family=Playfair+Display:ital,wght@0,700;1,400&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --paper:      #fdf6e3;
    --paper-dark: #f5ecce;
    --paper-edge: #e8ddbf;
    --spine:      #6b4c2a;
    --spine-hi:   #9b7b50;
    --ink:        #2a2318;
    --ink-muted:  #6a5d42;
    --green:      #2d6a3f;
    --green-pale: #eaf3e0;
    --bubble-bg:  #2a4128;
    --bubble-fg:  #fef7e0;
    --shadow:     rgba(40,25,10,0.22);
  }

  body {
    background: #4a3728;
    background-image:
      repeating-linear-gradient(90deg,transparent,transparent 60px,rgba(0,0,0,0.04) 60px,rgba(0,0,0,0.04) 61px),
      repeating-linear-gradient(transparent,transparent 60px,rgba(0,0,0,0.04) 60px,rgba(0,0,0,0.04) 61px);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 2rem 1rem;
    font-family: 'Lora', Georgia, serif;
  }

  /* ── BOOK SHELL ── */
  .book-shell {
    position: relative;
    width: min(1080px, 100%);
    perspective: 1800px;
  }

  /* Drop shadow beneath */
  .book-shell::after {
    content: '';
    position: absolute;
    bottom: -28px;
    left: 8%;
    right: 8%;
    height: 30px;
    background: radial-gradient(ellipse at center, rgba(0,0,0,0.5) 0%, transparent 75%);
    filter: blur(6px);
    pointer-events: none;
  }

  /* ── OPEN BOOK BODY ── */
  .book-body {
    display: flex;
    width: 100%;
    border-radius: 3px 12px 12px 3px;
    overflow: visible;
    position: relative;
    box-shadow:
      -8px 0 30px rgba(0,0,0,0.35),
       8px 0 30px rgba(0,0,0,0.25),
       0   4px 20px rgba(0,0,0,0.3);
  }

  /* ── SPINE ── */
  .spine {
    width: 32px;
    flex-shrink: 0;
    background: linear-gradient(to right, #4a3220 0%, var(--spine) 30%, var(--spine-hi) 50%, var(--spine) 70%, #4a3220 100%);
    position: relative;
    border-radius: 4px 0 0 4px;
    box-shadow: inset -3px 0 8px rgba(0,0,0,0.4), inset 3px 0 6px rgba(255,255,255,0.08);
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 10;
  }

  .spine-title {
    writing-mode: vertical-rl;
    transform: rotate(180deg);
    color: #e8d5a3;
    font-family: 'Playfair Display', serif;
    font-size: 0.7rem;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    opacity: 0.85;
    white-space: nowrap;
  }

  /* ── LEFT PAGE ── */
  .page-left {
    flex: 1;
    background: var(--paper);
    padding: 2.5rem 2rem 2rem 2.2rem;
    position: relative;
    border-right: 1px solid #d4c8a8;
    box-shadow: inset -18px 0 30px rgba(0,0,0,0.08);
    min-height: 560px;
    display: flex;
    flex-direction: column;
  }

  /* Subtle page lines */
  .page-left::before {
    content: '';
    position: absolute;
    inset: 0;
    background-image: repeating-linear-gradient(transparent, transparent 31px, rgba(180,165,130,0.18) 31px, rgba(180,165,130,0.18) 32px);
    background-position: 0 48px;
    pointer-events: none;
  }

  /* ── RIGHT PAGE ── */
  .page-right {
    flex: 1;
    background: var(--paper-dark);
    padding: 2.5rem 2.2rem 2rem 2rem;
    position: relative;
    border-radius: 0 8px 8px 0;
    box-shadow: inset 14px 0 28px rgba(0,0,0,0.07);
    min-height: 560px;
    display: flex;
    flex-direction: column;
  }

  .page-right::before {
    content: '';
    position: absolute;
    inset: 0;
    background-image: repeating-linear-gradient(transparent, transparent 31px, rgba(180,165,130,0.14) 31px, rgba(180,165,130,0.14) 32px);
    background-position: 0 48px;
    pointer-events: none;
    border-radius: 0 8px 8px 0;
  }

  /* Page curl on right */
  .page-right::after {
    content: '';
    position: absolute;
    bottom: 0;
    right: 0;
    width: 36px;
    height: 36px;
    background: linear-gradient(225deg, #c8b98a 45%, transparent 45%);
    border-radius: 0 0 8px 0;
    pointer-events: none;
  }

  /* ── CONTENT LAYOUT ── */
  .spread-inner {
    display: flex;
    flex-direction: column;
    gap: 1.4rem;
    flex: 1;
  }

  /* Page number */
  .pg-num {
    font-family: 'Playfair Display', serif;
    font-style: italic;
    font-size: 0.75rem;
    color: var(--ink-muted);
    letter-spacing: 0.05em;
    margin-bottom: 0.3rem;
  }

  /* Chapter / scene heading */
  .scene-heading {
    font-family: 'Playfair Display', serif;
    font-size: 1.05rem;
    font-weight: 700;
    color: var(--green);
    letter-spacing: 0.04em;
    margin-bottom: 0.8rem;
    border-bottom: 1.5px solid var(--paper-edge);
    padding-bottom: 0.5rem;
  }

  /* Photo block */
  .photo-block {
    border-radius: 6px;
    overflow: hidden;
    box-shadow: 0 3px 14px rgba(0,0,0,0.18), 0 0 0 3px var(--paper-edge);
    margin-bottom: 0.7rem;
    position: relative;
  }

  .photo-block img {
    width: 100%;
    display: block;
    aspect-ratio: 4 / 3;
    object-fit: cover;
  }

  .photo-caption {
    font-size: 0.68rem;
    font-style: italic;
    color: var(--ink-muted);
    background: var(--paper-edge);
    padding: 5px 10px;
    text-align: center;
    letter-spacing: 0.03em;
  }

  /* Story text */
  .story-text {
    font-size: 0.96rem;
    line-height: 1.75;
    color: var(--ink);
  }

  .story-text p + p {
    margin-top: 1rem;
  }

  /* First letter drop-cap on page 1 */
  .drop-cap::first-letter {
    float: left;
    font-family: 'Playfair Display', serif;
    font-size: 3.8rem;
    line-height: 0.75;
    margin: 0.05rem 0.12rem -0.1rem 0;
    color: var(--green);
  }

  /* Clickable vocabulary words */
  .word {
    text-decoration-line: underline;
    text-decoration-style: dotted;
    text-decoration-color: var(--green);
    text-underline-offset: 3px;
    color: var(--green);
    font-weight: 600;
    cursor: pointer;
    border-radius: 3px;
    transition: background 0.12s;
  }
  .word:hover { background: var(--green-pale); }

  /* Translation bubble */
  .t-bubble {
    position: fixed;
    background: var(--bubble-bg);
    color: var(--bubble-fg);
    font-family: 'Lora', serif;
    font-style: italic;
    font-size: 0.8rem;
    padding: 6px 18px;
    border-radius: 999px;
    pointer-events: none;
    z-index: 9999;
    white-space: nowrap;
    box-shadow: 0 4px 16px rgba(0,0,0,0.3);
    animation: bubblePop 0.15s ease;
    transform-origin: center bottom;
  }

  @keyframes bubblePop {
    from { opacity: 0; transform: scale(0.7); }
    to   { opacity: 1; transform: scale(1); }
  }

  /* Page-turn animation */
  @keyframes pageTurn {
    from { opacity: 0; transform: translateX(12px); }
    to   { opacity: 1; transform: translateX(0); }
  }
  .turning { animation: pageTurn 0.3s ease; }

  /* ── NAVIGATION BAR ── */
  .nav-bar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    width: min(1080px, 100%);
    margin-top: 1.4rem;
    padding: 0 2px;
  }

  .nav-btn {
    background: rgba(255,255,255,0.12);
    border: 1.5px solid rgba(255,255,255,0.22);
    color: #e8d5a3;
    font-family: 'Playfair Display', serif;
    font-style: italic;
    font-size: 0.9rem;
    padding: 9px 28px;
    border-radius: 999px;
    cursor: pointer;
    transition: background 0.18s, transform 0.12s;
    letter-spacing: 0.04em;
  }
  .nav-btn:hover  { background: rgba(255,255,255,0.22); }
  .nav-btn:active { transform: scale(0.95); }
  .nav-btn:disabled { opacity: 0.3; cursor: default; }

  .page-pip-row {
    display: flex;
    gap: 8px;
    align-items: center;
  }

  .pip {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: rgba(255,255,255,0.25);
    transition: background 0.2s, transform 0.2s;
    cursor: pointer;
  }
  .pip.active {
    background: #e8d5a3;
    transform: scale(1.3);
  }

  /* ── COVER PAGE ── */
  .cover-layout {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    height: 100%;
    min-height: 500px;
    text-align: center;
    gap: 1.4rem;
  }

  .cover-title {
    font-family: 'Playfair Display', serif;
    font-size: 2.4rem;
    font-weight: 700;
    color: var(--green);
    line-height: 1.1;
    letter-spacing: -0.01em;
  }

  .cover-subtitle {
    font-family: 'Lora', serif;
    font-style: italic;
    font-size: 1rem;
    color: var(--ink-muted);
    letter-spacing: 0.06em;
  }

  .cover-img {
    width: 80%;
    max-width: 320px;
    border-radius: 8px;
    box-shadow: 0 6px 22px rgba(0,0,0,0.22), 0 0 0 4px var(--paper-edge);
  }

  .cover-rule {
    width: 60px;
    height: 2px;
    background: var(--green);
    opacity: 0.4;
    border-radius: 2px;
  }

  /* ── VOCAB KEY (bottom of left page) ── */
  .vocab-hint {
    margin-top: auto;
    padding-top: 1rem;
    font-size: 0.68rem;
    color: var(--ink-muted);
    font-style: italic;
    border-top: 1px dashed var(--paper-edge);
  }

  /* ── RESPONSIVE ── */
  @media (max-width: 700px) {
    .book-body { flex-direction: column; border-radius: 6px; }
    .spine { width: 100%; height: 20px; border-radius: 6px 6px 0 0; }
    .spine-title { writing-mode: horizontal-tb; transform: none; font-size: 0.6rem; }
    .page-left, .page-right { min-height: auto; padding: 1.4rem 1.2rem; }
    .page-right::after { display: none; }
    .cover-title { font-size: 1.7rem; }
    .drop-cap::first-letter { font-size: 2.8rem; }
  }
</style>
</head>
<body>

<div class="book-shell">
  <div class="book-body" id="book">

    <!-- SPINE -->
    <div class="spine">
      <span class="spine-title">Creek Explorers</span>
    </div>

    <!-- LEFT PAGE -->
    <div class="page-left" id="leftPage">
      <div class="spread-inner" id="leftContent">
        <!-- injected by JS -->
      </div>
    </div>

    <!-- RIGHT PAGE -->
    <div class="page-right" id="rightPage">
      <div class="spread-inner" id="rightContent">
        <!-- injected by JS -->
      </div>
    </div>

  </div>
</div>

<!-- NAV -->
<div class="nav-bar">
  <button class="nav-btn" id="prevBtn">&#8592; Previous</button>
  <div class="page-pip-row" id="pips"></div>
  <button class="nav-btn" id="nextBtn">Next &#8594;</button>
</div>

<script>
const RU = {
  "trickle":       "журчание, струйка",
  "bubble":        "пузырьки / бульканье",
  "gurgle":        "журчание / клокотание",
  "creek":         "ручей",
  "field trip":    "экскурсия / выездное занятие",
  "edge":          "край / берег",
  "chunk of land": "кусок земли / осыпавшийся участок",
  "pile":          "куча / горка",
  "bottom":        "дно / нижняя часть",
  "pointy":        "остроконечный, заострённый",
  "head back":     "отправляться обратно",
  "trail":         "тропа / тропинка"
};

function w(term, display) {
  const d = display || term;
  return `<span class="word" data-term="${term}">${d}</span>`;
}

/* Each spread = { left: htmlString, right: htmlString }
   Spread 0 = cover spread */
const IMG = (src, alt, cap) => `
  <div class="photo-block">
    <img src="${src}" alt="${alt}" loading="lazy"
         onerror="this.src='https://placehold.co/600x450/e2d9c8/5c543b?text=${encodeURIComponent(alt)}'">
    <div class="photo-caption">${cap}</div>
  </div>`;

const spreads = [
  /* ── SPREAD 0 : COVER ── */
  {
    left: `
      <div class="cover-layout">
        <div class="cover-rule"></div>
        <div class="cover-title">Creek<br>Explorers</div>
        <div class="cover-subtitle">A Science Picture Book</div>
        <img class="cover-img"
          src="https://balmungax.github.io/phonicshub/Creek%20explorers/slide_01_image_01.jpg"
          alt="Creek scene"
          onerror="this.src='https://placehold.co/400x300/eaf3e0/2d6a3f?text=Creek+Explorers'">
        <div class="cover-rule"></div>
        <div style="font-size:0.75rem;color:var(--ink-muted);font-style:italic;letter-spacing:0.06em;">
          Grade 2 · Field Science Series
        </div>
      </div>`,
    right: `
      <div style="display:flex;flex-direction:column;height:100%;justify-content:center;gap:1.4rem;padding:1rem 0;">
        <p class="pg-num">How to use this book</p>
        <p class="story-text">
          As you read, look for <span class="word" data-term="creek" style="pointer-events:none">green underlined words</span>.
          Tap or click any underlined word to see its Russian translation.
        </p>
        <hr style="border:none;border-top:1.5px dashed var(--paper-edge);">
        <div class="story-text" style="font-size:0.85rem;color:var(--ink-muted);">
          <p><strong>Vocabulary in this book:</strong></p>
          <br>
          ${Object.keys(RU).map(k=>`<p style="margin-bottom:4px;">· <em>${k}</em></p>`).join('')}
        </div>
      </div>`
  },
  /* ── SPREAD 1 : Page 1 (intro) ── */
  {
    left: `
      <p class="pg-num">Page 1</p>
      <p class="scene-heading">🌿 At the Creek</p>
      ${IMG(
        'https://balmungax.github.io/phonicshub/Creek%20explorers/slide_01_image_01.jpg',
        'Creek explorers title scene',
        'A second-grade class visits the creek'
      )}
      <p class="vocab-hint">🇷🇺 Tap any green word for Russian</p>`,
    right: `
      <p class="pg-num">&nbsp;</p>
      <div class="story-text drop-cap">
        <p>${w('trickle','Trickle')}, ${w('bubble')}, ${w('gurgle')}. The water makes
        sound as it moves across the land. These are the sounds of a ${w('creek')}.
        Have you ever seen a ${w('creek')}?</p>
        <p>This second grade class is exploring a ${w('creek')} on a ${w('field trip')}.
        They are making observations to find evidence of fast and slow change
        happening to land in their community.</p>
      </div>`
  },
  /* ── SPREAD 2 : Page 2 (edge + chunk) ── */
  {
    left: `
      <p class="pg-num">Page 2</p>
      <p class="scene-heading">🌧️ After the Rain</p>
      ${IMG(
        'https://balmungax.github.io/phonicshub/Creek%20explorers/slide_02_image_01.jpg',
        'Raul and Dua near muddy creek edge',
        'Raul & Dua at the creek edge'
      )}`,
    right: `
      <p class="pg-num">&nbsp;</p>
      <div class="story-text">
        <p>Raul and Dua look at the ${w('edge')} of the ${w('creek')}. The ground is wet
        and muddy because it rained a lot the night before. It looks like a
        ${w('chunk of land')} is missing from the side of the ${w('creek')}.</p>
        <p>Dua says, <em>"Wow! Where did that big piece of land go?"</em></p>
        <p style="margin-top:1rem;padding:0.8rem 1rem;background:var(--green-pale);border-left:3px solid var(--green);border-radius:0 6px 6px 0;font-size:0.88rem;color:var(--green);">
          💭 <strong>Think about it:</strong> What do you think happened to the land?
        </p>
      </div>`
  },
  /* ── SPREAD 3 : Page 3 (sticks and logs) ── */
  {
    left: `
      <p class="pg-num">Page 3</p>
      <p class="scene-heading">🌲 Sticks and Logs</p>
      ${IMG(
        'https://balmungax.github.io/phonicshub/Creek%20explorers/slide_03_image_01.jpg',
        'Fallen sticks and logs in water',
        'Sticks and logs gathered in the creek'
      )}`,
    right: `
      <p class="pg-num">&nbsp;</p>
      <div class="story-text">
        <p>Graham and Jake stop to get a closer look. Jake says,
        <em>"Look at all the sticks and logs in the middle of the water.
        They must have fallen into the ${w('creek')}."</em></p>
        <p style="margin-top:1rem;padding:0.8rem 1rem;background:var(--green-pale);border-left:3px solid var(--green);border-radius:0 6px 6px 0;font-size:0.88rem;color:var(--green);">
          💭 <strong>Think about it:</strong> How do you think the sticks and logs moved into the water?
        </p>
      </div>`
  },
  /* ── SPREAD 4 : Page 4 (rocks) ── */
  {
    left: `
      <p class="pg-num">Page 4</p>
      <p class="scene-heading">🪨 The Rock Pile</p>
      ${IMG(
        'https://balmungax.github.io/phonicshub/Creek%20explorers/slide_04_image_01.jpg',
        'Rock pile near creek with flat and pointy stones',
        'Pile of rocks — flat &amp; pointy'
      )}`,
    right: `
      <p class="pg-num">&nbsp;</p>
      <div class="story-text">
        <p>Ria and Paul find a ${w('pile')} of rocks near the ${w('creek')}.
        They pick up one rock and make observations about its shape.
        All of the rocks are different shapes and sizes. The rock at the
        ${w('bottom')} of the ${w('pile')} is flat. The rock on top is smaller
        and ${w('pointy')}.</p>
        <p>Ria and Paul decide to leave the rocks where they are and keep
        going on their walk along the creek.</p>
        <p style="margin-top:1rem;padding:0.8rem 1rem;background:var(--green-pale);border-left:3px solid var(--green);border-radius:0 6px 6px 0;font-size:0.88rem;color:var(--green);">
          💭 <strong>Think about it:</strong> What made the rocks so many different shapes and sizes?
        </p>
      </div>`
  },
  /* ── SPREAD 5 : Page 5 (trail + dirt) ── */
  {
    left: `
      <p class="pg-num">Page 5</p>
      <p class="scene-heading">🥾 The Forest Trail</p>
      ${IMG(
        'https://balmungax.github.io/phonicshub/Creek%20explorers/slide_05_image_01.jpg',
        'Trail with fresh pile of dirt',
        'Fresh dirt on the forest trail'
      )}`,
    right: `
      <p class="pg-num">&nbsp;</p>
      <div class="story-text">
        <p>The second graders start to ${w('head back')} to the bus.
        They follow the ${w('trail')} and Zack and Fred see a ${w('pile')} of
        dirt on the ground.</p>
        <p>Fred says, <em>"My family was here a few days ago, and there was
        no dirt on the ${w('trail')}."</em></p>
        <p style="margin-top:1rem;padding:0.8rem 1rem;background:var(--green-pale);border-left:3px solid var(--green);border-radius:0 6px 6px 0;font-size:0.88rem;color:var(--green);">
          💭 <strong>Think about it:</strong> What do you think happened to the dirt on the trail?
        </p>
      </div>`
  },
  /* ── SPREAD 6 : Page 6 (final) ── */
  {
    left: `
      <p class="pg-num">Page 6</p>
      <p class="scene-heading">🍃 Wind &amp; Water</p>
      ${IMG(
        'https://balmungax.github.io/phonicshub/Creek%20explorers/slide_06_image_01.jpg',
        'Children reflecting on changes in nature',
        'The class reflects on what they observed'
      )}`,
    right: `
      <p class="pg-num">&nbsp;</p>
      <div class="story-text">
        <p>The second grade class enjoyed making observations at the ${w('creek')}
        for their ${w('field trip')}. On their way back to school they discuss the
        different kinds of evidence they found of fast and slow changes to
        the land in their community.</p>
        <p>Wind and water change the land around us every day. Sometimes
        these changes are <em>fast</em> and sometimes these changes are <em>slow</em>.</p>
        <p style="margin-top:1.2rem;font-family:'Playfair Display',serif;font-size:1.1rem;color:var(--green);font-style:italic;text-align:center;">
          What kinds of changes to the land will <em>you</em> observe next?
        </p>
      </div>
      <p style="margin-top:auto;font-size:0.68rem;color:var(--ink-muted);font-style:italic;text-align:center;border-top:1px dashed var(--paper-edge);padding-top:0.8rem;">
        — The End —
      </p>`
  }
];

let current = 0;
const leftContent  = document.getElementById('leftContent');
const rightContent = document.getElementById('rightContent');
const prevBtn = document.getElementById('prevBtn');
const nextBtn = document.getElementById('nextBtn');
const pipsEl  = document.getElementById('pips');

/* Build pip dots */
spreads.forEach((_, i) => {
  const pip = document.createElement('div');
  pip.className = 'pip' + (i === 0 ? ' active' : '');
  pip.addEventListener('click', () => goTo(i));
  pipsEl.appendChild(pip);
});

function render(animate) {
  const spread = spreads[current];
  if (animate) {
    leftContent.classList.remove('turning');
    rightContent.classList.remove('turning');
    void leftContent.offsetWidth;
    leftContent.classList.add('turning');
    rightContent.classList.add('turning');
  }
  leftContent.innerHTML  = spread.left;
  rightContent.innerHTML = spread.right;
  prevBtn.disabled = current === 0;
  nextBtn.disabled = current === spreads.length - 1;
  document.querySelectorAll('.pip').forEach((p, i) => p.classList.toggle('active', i === current));
  bindWords();
}

function goTo(idx) {
  current = Math.max(0, Math.min(spreads.length - 1, idx));
  render(true);
}

prevBtn.addEventListener('click', () => goTo(current - 1));
nextBtn.addEventListener('click', () => goTo(current + 1));

/* Keyboard navigation */
document.addEventListener('keydown', e => {
  if (e.key === 'ArrowRight') goTo(current + 1);
  if (e.key === 'ArrowLeft')  goTo(current - 1);
});

/* ── Translation bubbles ── */
let activeBubble = null, bubbleTimer = null;

function removeBubble() {
  if (activeBubble) { activeBubble.remove(); activeBubble = null; }
  if (bubbleTimer)  { clearTimeout(bubbleTimer); bubbleTimer = null; }
}

function bindWords() {
  document.querySelectorAll('.word').forEach(el => {
    el.addEventListener('click', function(e) {
      e.stopPropagation();
      removeBubble();
      const key   = this.getAttribute('data-term');
      const trans = RU[key];
      if (!trans) return;
      const rect = this.getBoundingClientRect();
      const bbl  = document.createElement('div');
      bbl.className   = 't-bubble';
      bbl.textContent = `🇷🇺 ${trans}`;
      document.body.appendChild(bbl);
      const bw = bbl.offsetWidth;
      let left = rect.left + rect.width / 2 - bw / 2;
      left = Math.max(8, Math.min(left, window.innerWidth - bw - 8));
      bbl.style.left = left + 'px';
      bbl.style.top  = (rect.bottom + window.scrollY + 8) + 'px';
      activeBubble = bbl;
      bubbleTimer  = setTimeout(removeBubble, 2200);
    });
  });
}

document.addEventListener('click', removeBubble);
window.addEventListener('resize', removeBubble);

render(false);
</script>
</body>
</html>
